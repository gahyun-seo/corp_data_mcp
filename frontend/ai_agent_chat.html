<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>DartAI – AI Agent Chat</title>
    <meta name="viewport" content="width=1280" />

    <!-- Pretendard -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/agent-chat.css" />
  </head>
  <body>
    <div class="page">
      <!-- 공통 네비 -->
      <header class="top-nav">
        <div class="nav-inner">
          <div class="logo">DartAI</div>
          <nav class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="ai_agent.html" class="nav-link active">AI Agent</a>
            <a href="finance_search.html" class="nav-link">Finance Search</a>
            <a href="portfolio.html" class="nav-link">Portfolio Optimization</a>
          </nav>
        </div>
      </header>

      <!-- 채팅 화면 -->
      <main class="chat-page">
        <!-- 이 타이틀은 유저가 입력할 때마다 바뀜 -->
        <h1 class="chat-title" id="chat-topic">AI Agent 대화</h1>

        <div class="chat-card">
          <!-- 전부 스크롤되는 영역 -->
          <div class="chat-body" id="chat-body">
            <!-- JS가 여기에 user → divider → agent 순서로 계속 추가함 -->
          </div>
        </div>

        <!-- 아래 입력창 -->
        <form id="chat-input-form" class="chat-input">
          <input
            type="text"
            id="chat-input"
            name="q"
            placeholder="무엇이든 검색하세요."
            autocomplete="off"
          />
          <button type="submit" class="chat-submit">검색</button>
        </form>
      </main>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
